[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marionette"
version = "0.1.0"
description = "Blender rendering framework with Modal cloud GPU support"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "modal>=0.55.0",
]

[project.scripts]
marionette = "marionette.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
