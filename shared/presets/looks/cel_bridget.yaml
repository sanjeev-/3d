# Painted-control-data cel variant.
#
# Same shader math as cel_zen, driven by painted offset maps and vertex masks,
# with a texture-gated specular. Needs an ILM/offset texture bound per material.
name: cel_bridget
look: cel
params:
  light_push: 1.0
  shadow_push: 0.5
  shadow_smoothness: 0.0
  shadow_vertex_threshold: 0.0
  shadow2_push: -1.0
  shadow2_vertex_threshold: 0.0
  permanent_shadow_threshold: -1.0
  specular_size: 0.2         # ILM-gated hard specular
  rim_size: -1.0             # rimlights off
  rim_intensity: 1.0
  shadow_rim_size: -1.0
  shadow_rim_intensity: 0.5
  use_offset_map: true
  use_vertex_shadow_mask: true
  light_direction: [53.46, -27.73, 50.65]
